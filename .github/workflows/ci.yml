# Typecheck, unit/component tests, production build and Playwright end-to-end tests.
# Written for GitHub Actions; it has not yet been run on GitHub (see docs/TESTING.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit, integration and component tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Legacy prototype tests
        run: node --test legacy/marketlab-prototype/tests/simulation.test.mjs

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
